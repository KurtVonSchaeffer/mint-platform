<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <linearGradient id="arch-g" x1="96" y1="14" x2="96" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C4B5FD"/>
      <stop offset="55%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Arch gateway mark: left leg + semicircular top + short right leg -->
  <path d="M 48 148 L 48 62 Q 48 14 96 14 Q 144 14 144 62 L 144 96"
        stroke="url(#arch-g)" stroke-width="13" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dark circle sitting at the base inside the arch -->
  <circle cx="96" cy="112" r="40" fill="#1A1F36"/>

  <!-- Wordmark — light weight, dark navy -->
  <text x="178" y="116"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="74" font-weight="300"
        fill="#1A1F36" letter-spacing="-1.5">AlgoLend</text>
</svg>
