<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Suspended</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090B;
      color: #FAFAFA;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.18) 0%, transparent 65%);
      filter: blur(40px);
      pointer-events: none;
    }
    .card {
      position: relative;
      max-width: 460px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 40px;
      backdrop-filter: blur(12px);
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 36px;
    }
    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }
    .icon-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #fff;
    }
    p.sub {
      font-size: 15px;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 28px 0;
    }
    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #7C3AED, #9B5CF6);
      color: #fff;
      box-shadow: 0 8px 24px -6px rgba(124,58,237,0.5);
    }
    .btn-primary:hover { box-shadow: 0 12px 32px -6px rgba(124,58,237,0.65); }
    .btn-whatsapp {
      background: rgba(37,211,102,0.12);
      color: #25D366;
      border: 1px solid rgba(37,211,102,0.2);
    }
    .btn-whatsapp:hover { background: rgba(37,211,102,0.18); }
    .footer-note {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-label="AlgoLend">
        <path d="M 6 30 L 6 14 C 6 8.48 10.48 4 16 4 C 21.52 4 26 8.48 26 14 L 26 30"
          stroke="#7C3AED" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="16" cy="15" r="5.5" fill="#09090B"/>
      </svg>
      <span class="logo-text">AlgoLend</span>
    </div>

    <!-- Warning icon -->
    <div class="icon-ring">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="#F87171" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <h1>Account suspended</h1>
    <p class="sub">
      Access to this platform has been temporarily suspended.<br />
      To restore access, please contact Mint Platforms or settle
      any outstanding invoices.
    </p>

    <div class="divider"></div>

    <div class="cta-group">
      <!-- WhatsApp CTA — update number as needed -->
      <a href="https://wa.me/27102760531?text=Hi%2C%20I%20need%20to%20reactivate%20my%20AlgoLend%20account"
         class="btn btn-whatsapp" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.47 14.38c-.28-.14-1.65-.81-1.91-.9-.25-.1-.44-.14-.62.14-.18.28-.71.9-.87 1.08-.16.18-.32.2-.6.07-.28-.14-1.18-.43-2.24-1.38-.83-.74-1.39-1.65-1.55-1.93-.16-.28-.02-.44.12-.58.12-.12.28-.32.42-.48.14-.16.18-.28.28-.46.1-.18.05-.34-.02-.48-.07-.14-.62-1.5-.85-2.05-.22-.54-.45-.46-.62-.47-.16-.01-.34-.01-.52-.01-.18 0-.48.07-.73.34-.25.28-.96.94-.96 2.29 0 1.35.98 2.65 1.12 2.83.14.18 1.93 2.95 4.68 4.14.65.28 1.16.45 1.56.57.65.21 1.25.18 1.72.11.52-.08 1.65-.67 1.88-1.32.23-.65.23-1.2.16-1.32-.07-.12-.25-.18-.53-.32z"/>
          <path d="M12 2C6.48 2 2 6.48 2 12c0 1.77.46 3.43 1.26 4.87L2 22l5.28-1.24A9.95 9.95 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.62 0-3.13-.46-4.4-1.26l-.32-.19-3.13.73.75-3.05-.21-.33A7.96 7.96 0 014 12c0-4.42 3.58-8 8-8s8 3.58 8 8-3.58 8-8 8z"/>
        </svg>
        Chat on WhatsApp
      </a>

      <a href="mailto:info@algolend.co.za?subject=Account%20Reactivation%20Request"
         class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <polyline points="2,4 12,13 22,4"/>
        </svg>
        Email us
      </a>
    </div>
  </div>

  <p class="footer-note">Powered by Mint Platforms (Pty) Ltd</p>
</body>
</html>
